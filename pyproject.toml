[project]
name = "corvus"
version = "0.1.0"
description = "On-prem AI SOC analyst plugging into Wazuh."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "evtx>=0.14.0",
    "fastapi>=0.115",
    "httpx2>=2.16",
    "psycopg[binary]>=3.1",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.5",
    # Pinned exactly for the Sigma replay detector (LGPL, AGENTS.md
    # exception for this prompt): pySigma parses and converts the
    # SigmaHQ rules, the sqlite backend emits the match SQL.
    "pySigma==2.0.1",
    "pySigma-backend-sqlite==2.1.1",
    # Declared explicitly (was transitive via uvicorn): the static LLM
    # price book (config/price_book.yaml) loads through it. PyYAML 6.0.3
    # is the latest stable release, checked 2026-10-29.
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
corvus = "corvus.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corvus"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.14"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: postgres-backed integration tests"]
