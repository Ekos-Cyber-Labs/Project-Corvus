services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - ${CORVUS_ENV_FILE:?Set CORVUS_ENV_FILE to a secrets file outside the repository}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-corvus} -d $${POSTGRES_DB:-corvus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  corvus-api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${CORVUS_ENV_FILE:?Set CORVUS_ENV_FILE to a secrets file outside the repository}
    ports:
      - "127.0.0.1:8000:8000"
    command: ["uvicorn", "corvus.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  corvus-worker:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${CORVUS_ENV_FILE:?Set CORVUS_ENV_FILE to a secrets file outside the repository}
    command: ["python", "-m", "corvus.worker"]

volumes:
  postgres-data:
